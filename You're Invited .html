<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>You're Invited · Dana's Birthday Dinner</title>
<style>
:root{--bg1:#f8f3ec;--bg2:#e6dccd;--ink:#8a7058;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at center,var(--bg1),var(--bg2));font-family:Georgia,'Times New Roman',serif;overflow:hidden;color:var(--ink);overscroll-behavior:none}
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;touch-action:none;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.zoom{animation:zoomin 2.2s cubic-bezier(.16,.84,.25,1) both}
.float{animation:float 3.4s ease-in-out 2.2s infinite}
.float.still{animation:none}
.wrap{position:relative;width:min(94vw,640px);aspect-ratio:3/2}
.env,.card{position:absolute;will-change:transform,opacity}
.env{inset:0;width:100%;height:100%;border-radius:6px;box-shadow:0 20px 44px rgba(90,70,50,.3);z-index:2;pointer-events:none}
.card{left:50%;top:50%;height:min(86vh,calc(94vw*1.414),840px);aspect-ratio:1240/1754;border-radius:4px;box-shadow:0 26px 60px rgba(90,70,50,.38);z-index:1;opacity:0;pointer-events:none}
.seal{position:absolute;left:50%;top:51%;width:19%;aspect-ratio:1;border-radius:50%;z-index:3;pointer-events:none;animation:glow 2.4s ease-in-out 2.4s infinite}
.hint{position:absolute;left:0;right:0;bottom:calc(7vh + env(safe-area-inset-bottom,0px));text-align:center;letter-spacing:.3em;text-transform:uppercase;font-size:12px;pointer-events:none}
.hint .arrow{display:block;font-size:20px;margin-bottom:8px;animation:bob 1.6s ease-in-out infinite}
.hint.down .arrow{animation-name:bobdown}
.hint span.t{animation:pulse 2s ease-in-out infinite}
.dust{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.dust i{position:absolute;bottom:-10px;width:5px;height:5px;border-radius:50%;background:rgba(190,160,110,.55);animation:rise linear infinite}
@keyframes zoomin{0%{transform:scale(.35) translateY(60px);opacity:0;filter:blur(6px)}60%{opacity:1;filter:blur(0)}100%{transform:scale(1) translateY(0);opacity:1}}
@keyframes float{50%{transform:translateY(-7px)}}
@keyframes glow{50%{box-shadow:0 0 28px 8px rgba(255,235,200,.55)}}
@keyframes pulse{50%{opacity:.35}}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes bobdown{50%{transform:translateY(8px)}}
@keyframes rise{to{transform:translateY(-110vh) translateX(30px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head>

    <div class="seal" id="seal"></div>
  </div></div></div>
  <div class="hint" id="hint"><span class="arrow" id="arrow">&#8593;</span><span class="t" id="ht">Swipe up to open</span></div>
</div>
<script>
(function(){
  var st=document.getElementById('stage'),env=document.getElementById('env'),card=document.getElementById('card'),
      seal=document.getElementById('seal'),fl=document.getElementById('float'),hint=document.getElementById('hint'),
      ht=document.getElementById('ht'),arrow=document.getElementById('arrow'),dust=document.getElementById('dust');
  var p=0,raf=null;
  function cl(x){return Math.max(0,Math.min(1,x))}
  function ease(x){return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2}
  function render(v){
    p=v;
    var e=ease(cl((v-.25)/.75)), c=ease(cl(v));
    env.style.transform='translateY('+(e*58)+'vh) rotate('+(-e*4)+'deg) scale('+(1-e*.12)+')';
    env.style.opacity=1-cl((v-.55)/.45);
    seal.style.transform='translate(-50%,-50%) scale('+(1+v*.5)+')';
    seal.style.opacity=1-cl(v*3);
    card.style.opacity=cl(v*3);
    card.style.transform='translate(-50%,calc(-50% + '+((1-c)*6)+'%)) scale('+(.3+.7*c)+') rotate('+((1-c)*-2)+'deg)';
    var open=v>.5;
    ht.textContent=open?'Swipe down to close':'Swipe up to open';
    arrow.innerHTML=open?'&#8595;':'&#8593;';
    hint.classList.toggle('down',open);
    hint.style.opacity=(v>.05&&v<.95)?0:1;
    fl.classList.toggle('still',v>.02);
  }
  function tween(to){
    cancelAnimationFrame(raf);
    var from=p,t0=performance.now(),d=900*Math.max(.35,Math.abs(to-from));
    (function step(now){
      var k=cl((now-t0)/d); render(from+(to-from)*ease(k));
      if(k<1) raf=requestAnimationFrame(step);
    })(t0);
  }
  var drag=false,sy=0,sp=0,ly=0,lt=0,vel=0,moved=0;
  st.addEventListener('pointerdown',function(e){
    drag=true;sy=ly=e.clientY;sp=p;lt=e.timeStamp;vel=0;moved=0;cancelAnimationFrame(raf);
    try{st.setPointerCapture(e.pointerId)}catch(_){}
  });
  st.addEventListener('pointermove',function(e){
    if(!drag)return;
    var dt=Math.max(1,e.timeStamp-lt);
    vel=(ly-e.clientY)/dt; ly=e.clientY; lt=e.timeStamp;
    moved=Math.max(moved,Math.abs(sy-e.clientY));
    render(cl(sp+(sy-e.clientY)/(innerHeight*.55)));
  });
  function end(){
    if(!drag)return; drag=false;
    var to;
    if(moved<8) to=p>.5?0:1;
    else if(Math.abs(vel)>.5) to=vel>0?1:0;
    else to=p>.45?1:0;
    tween(to);
  }
  st.addEventListener('pointerup',end);
  st.addEventListener('pointercancel',end);
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowUp'||e.key==='Enter')tween(1);
    if(e.key==='ArrowDown'||e.key==='Escape')tween(0);
  });
  for(var i=0;i<16;i++){
    var s=document.createElement('i');
    s.style.left=Math.random()*100+'%';
    s.style.animationDuration=(7+Math.random()*8)+'s';
    s.style.animationDelay=(-Math.random()*12)+'s';
    s.style.width=s.style.height=(3+Math.random()*4)+'px';
    dust.appendChild(s);
  }
  render(0);
})();
</script>
